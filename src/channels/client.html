<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>agent-ally</title>
    <style>
      :root { color-scheme: dark light; }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0; padding: 1.25rem;
        background: #12131a; color: #f2f3f7;
        min-height: 100vh;
      }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
      h1 { font-size: 1rem; font-weight: 600; opacity: 0.7; margin: 0; }
      #voice-btn { width: auto; padding: 0.3rem 0.7rem; font-size: 1.1rem; background: transparent; border: 1px solid #333; border-radius: 8px; color: #f2f3f7; margin: 0; cursor: pointer; }
      #voice-btn.off { opacity: 0.4; }
      #status { opacity: 0.7; font-size: 0.95rem; }
      #title { font-size: 1.4rem; line-height: 1.35; margin: 0.5rem 0 0.25rem; }
      .risk { display: inline-block; font-weight: 700; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.8rem; margin-bottom: 0.5rem; }
      .risk.high { background: #ff4d4f; color: #fff; }
      .risk.medium { background: #d89614; color: #111; }
      .risk.low { background: #2f6f3e; color: #fff; }
      #command { background: #000; color: #7fd; padding: 0.6rem 0.8rem; border-radius: 8px; font-family: ui-monospace, monospace; font-size: 0.85rem; white-space: pre-wrap; word-break: break-all; margin: 0.5rem 0; }
      button {
        display: block; width: 100%; margin: 0.6rem 0; padding: 1.1rem;
        font-size: 1.15rem; font-weight: 600; border: 0; border-radius: 12px;
        background: #2b6ef2; color: #fff; cursor: pointer;
      }
      button.secondary { background: #2a2d3a; color: #f2f3f7; }
      button .desc { display: block; font-weight: 400; font-size: 0.9rem; opacity: 0.85; margin-top: 0.2rem; }
      button.confirm { background: #ff4d4f; }
      #transcript { margin: 1rem 0; display: flex; flex-direction: column; gap: 0.5rem; }
      .msg { padding: 0.6rem 0.8rem; border-radius: 10px; font-size: 0.98rem; line-height: 1.4; word-break: break-word; }
      .msg.agent { background: #1c2030; }
      .msg.you { background: #23324d; align-self: flex-end; }
      .msg.system { background: transparent; opacity: 0.6; font-size: 0.85rem; text-align: center; }
      .msg .time { display: block; font-size: 0.7rem; opacity: 0.5; margin-bottom: 0.15rem; }
      /* Lightweight rendering of the Markdown Claude writes, so ** and ` don't
         show as raw characters (and aren't read aloud by mobile screen readers). */
      .msg strong { font-weight: 700; }
      .msg code { background: #000; color: #7fd; padding: 0.05rem 0.32rem; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 0.85em; }
      .msg ul { margin: 0.3rem 0; padding-left: 1.2rem; }
      .msg li { margin: 0.15rem 0; }
      .msg .h { font-weight: 700; margin: 0.2rem 0; }
      .msg .body > div:empty { height: 0.5rem; }
      .day { align-self: center; font-size: 0.72rem; opacity: 0.55; text-transform: uppercase; letter-spacing: 0.05em; margin: 0.85rem 0 0.15rem; }
      #composer { display: none; gap: 0.5rem; margin-top: 1rem; }
      /* Pin the input to the bottom of the viewport so a long resumed history
         never pushes it off-screen — it stays reachable while the thread scrolls
         behind it. */
      #composer.on {
        display: flex; flex-direction: column;
        position: sticky; bottom: 0;
        background: #12131a;
        padding: 0.6rem 0 calc(0.7rem + env(safe-area-inset-bottom));
        border-top: 1px solid #23242e;
      }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
      /* One-row composer: attach · text · send, all inside a rounded pill. */
      .input-bar { display: flex; align-items: flex-end; gap: 0.25rem; width: 100%; border: 1px solid #333; border-radius: 22px; background: #0d0e14; padding: 0.25rem 0.4rem; }
      .input-bar:focus-within { border-color: #2b6ef2; }
      #prompt { flex: 1; min-width: 0; min-height: 1.6rem; max-height: 8rem; padding: 0.5rem 0.2rem; font-size: 1.05rem; line-height: 1.35; border: 0; background: transparent; color: #f2f3f7; resize: none; overflow-y: auto; }
      #prompt:focus { outline: none; }
      .icon-btn { flex: 0 0 auto; margin: 0; padding: 0; width: auto; display: flex; align-items: center; justify-content: center; border-radius: 999px; line-height: 1; }
      #attach { width: 2.2rem; height: 2.2rem; background: transparent; color: #8fa6c9; font-size: 1.25rem; }
      #attach:active { color: #2b6ef2; }
      /* Mic and send share the same slot — mic shows when empty, send when typing */
      #mic, #send { width: 2.4rem; height: 2.4rem; background: #2f6f3e; color: #fff; border-radius: 999px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
      #mic { font-size: 1rem; }
      #mic.listening { background: #ff4d4f; animation: pulse 1s ease-in-out infinite; }
      #mic:disabled { opacity: 0.3; }
      #send { font-size: 1.15rem; display: none; }
      #send:disabled { opacity: 0.4; }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(0.88); } }
      #attachments { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.2rem 0; }
      #attachments:empty { display: none; }
      .chip { display: inline-flex; align-items: center; gap: 0.35rem; background: #23324d; padding: 0.3rem 0.55rem; border-radius: 999px; font-size: 0.82rem; max-width: 100%; }
      .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 12rem; }
      .chip button { display: inline; width: auto; margin: 0; padding: 0 0.2rem; font-size: 1rem; background: transparent; color: #cdd; line-height: 1; }
    </style>
  </head>
  <body>
    <header>
      <h1>agent-ally &middot; remote</h1>
      <button type="button" id="voice-btn" aria-label="Toggle voice" title="Toggle voice">🔊</button>
    </header>
    <p id="status" role="status" aria-live="polite">Connecting&hellip;</p>

    <div id="decision" aria-live="assertive"></div>
    <div id="transcript" aria-live="polite" aria-label="Conversation"></div>

    <form id="composer" aria-label="Send a prompt">
      <label for="prompt" class="sr-only">Tell the agent what to do</label>
      <div id="attachments" aria-live="polite"></div>
      <input type="file" id="file" multiple hidden aria-hidden="true" />
      <div class="input-bar">
        <button type="button" id="attach" class="icon-btn" aria-label="Attach files" title="Attach">📎</button>
        <textarea id="prompt" rows="1" placeholder="Message…"></textarea>
        <button type="button" id="mic" class="icon-btn" aria-label="Speak prompt" title="Speak">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0h-2a5 5 0 0 1-10 0H5zm7 9v-2m-3 2h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          </svg>
        </button>
        <button type="submit" id="send" class="icon-btn" aria-label="Send" title="Send">➤</button>
      </div>
    </form>

    <script>
      const token = new URLSearchParams(location.search).get("token");
      const statusEl = document.getElementById("status");
      const decisionEl = document.getElementById("decision");
      const transcriptEl = document.getElementById("transcript");
      const composerEl = document.getElementById("composer");
      const promptEl = document.getElementById("prompt");
      const sendEl = document.getElementById("send");
      const fileEl = document.getElementById("file");
      const attachEl = document.getElementById("attach");
      const attachmentsEl = document.getElementById("attachments");

      // ── Phone voice (Web Speech API) ──────────────────────────────────────
      const voiceBtn = document.getElementById("voice-btn");
      let voiceOn = localStorage.getItem("aa-voice") !== "off";
      let speechReady = false; // iOS requires a user gesture before speaking
      let replayingHistory = false;

      function updateVoiceBtn() {
        voiceBtn.textContent = voiceOn ? "🔊" : "🔇";
        voiceBtn.classList.toggle("off", !voiceOn);
        voiceBtn.setAttribute("aria-label", voiceOn ? "Voice on — tap to mute" : "Voice off — tap to unmute");
      }
      updateVoiceBtn();

      voiceBtn.addEventListener("click", () => {
        voiceOn = !voiceOn;
        localStorage.setItem("aa-voice", voiceOn ? "on" : "off");
        updateVoiceBtn();
        if (voiceOn) speak("Voice on.");
        else speechSynthesis.cancel();
      });

      // Warm up the speech engine on first user tap (required on iOS).
      document.addEventListener("click", () => {
        if (speechReady || !("speechSynthesis" in window)) return;
        speechReady = true;
        const warm = new SpeechSynthesisUtterance("");
        speechSynthesis.speak(warm);
      }, { once: true });

      function stripMarkdown(text) {
        return text
          .replace(/\*\*([^*]+)\*\*/g, "$1")
          .replace(/`([^`]+)`/g, "$1")
          .replace(/^#+\s+/gm, "")
          .replace(/^\s*[-*]\s+/gm, "")
          .trim();
      }

      function speak(text) {
        if (!voiceOn || !("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(stripMarkdown(text));
        speechSynthesis.speak(u);
      }
      // ── Voice input (Speech-to-Text) ──────────────────────────────────────
      const micBtn = document.getElementById("mic");
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SR) {
        micBtn.disabled = true;
        micBtn.title = "Voice input not supported in this browser";
      } else {
        const recognition = new SR();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = "en-US";
        let listening = false;

        recognition.onresult = (e) => {
          const transcript = Array.from(e.results).map((r) => r[0].transcript).join("");
          promptEl.value = transcript;
          autoGrow(); // also triggers mic↔send swap
        };

        recognition.onend = () => {
          listening = false;
          micBtn.classList.remove("listening");
          micBtn.setAttribute("aria-label", "Speak prompt");
          // Auto-send if something was captured
          if (promptEl.value.trim()) composerEl.requestSubmit();
        };

        recognition.onerror = () => {
          listening = false;
          micBtn.classList.remove("listening");
        };

        micBtn.addEventListener("click", () => {
          if (listening) {
            recognition.stop();
          } else {
            promptEl.value = "";
            autoGrow();
            recognition.start();
            listening = true;
            micBtn.classList.add("listening");
            micBtn.setAttribute("aria-label", "Stop listening");
          }
        });
      }
      // ─────────────────────────────────────────────────────────────────────

      const MAX_FILE_BYTES = 25 * 1024 * 1024; // keep in step with the server cap
      const MAX_FILES = 10;
      let pendingFiles = []; // { name, data } where data is a base64 data URL

      attachEl.addEventListener("click", () => fileEl.click());
      fileEl.addEventListener("change", () => {
        for (const file of Array.from(fileEl.files || [])) {
          if (pendingFiles.length >= MAX_FILES) { alert(`Up to ${MAX_FILES} files at a time.`); break; }
          if (file.size > MAX_FILE_BYTES) { alert(`"${file.name}" is too big (max 25 MB).`); continue; }
          const reader = new FileReader();
          reader.onload = () => { pendingFiles.push({ name: file.name, data: reader.result }); renderAttachments(); };
          reader.readAsDataURL(file);
        }
        fileEl.value = ""; // allow re-picking the same file later
      });

      function renderAttachments() {
        attachmentsEl.innerHTML = "";
        pendingFiles.forEach((f, i) => {
          const chip = document.createElement("div");
          chip.className = "chip";
          const name = document.createElement("span");
          name.textContent = f.name;
          const rm = document.createElement("button");
          rm.type = "button";
          rm.textContent = "×";
          rm.setAttribute("aria-label", `Remove ${f.name}`);
          rm.onclick = () => { pendingFiles.splice(i, 1); renderAttachments(); };
          chip.appendChild(name);
          chip.appendChild(rm);
          attachmentsEl.appendChild(chip);
        });
      }

      let current = null; // in-flight decision
      let armed = null; // value awaiting a confirm tap (high-risk)
      let acceptsPrompts = false;
      let busy = false;
      let ws;

      function connect() {
        ws = new WebSocket(`ws://${location.host}/?token=${token}`);
        ws.onopen = () => (statusEl.textContent = "Connected.");
        ws.onclose = () => {
          statusEl.textContent = "Disconnected. Reconnecting…";
          clearDecision();
          setTimeout(connect, 1500);
        };
        ws.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          if (msg.type === "hello") { acceptsPrompts = !!msg.acceptsPrompts; refreshComposer(); }
          else if (msg.type === "history") { transcriptEl.innerHTML = ""; lastDay = null; replayingHistory = true; (msg.entries || []).forEach((e) => addMessage(e.role, e.text, e.at)); replayingHistory = false; refreshComposer(); }
          else if (msg.type === "decision") render(msg.decision);
          else if (msg.type === "clear") clearDecision();
          else if (msg.type === "log") addMessage(msg.role, msg.text, msg.at);
          else if (msg.type === "status") { statusEl.textContent = msg.text; busy = !!msg.busy; refreshComposer(); }
        };
      }

      let lastDay = null; // day key of the last rendered message, for separators

      function parseAt(at) {
        if (!at) return null;
        const d = new Date(at);
        return isNaN(d.getTime()) ? null : d;
      }
      function dayLabel(d) {
        if (!d) return "Earlier";
        const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
        const diff = Math.round((startOf(new Date()) - startOf(d)) / 86400000);
        if (diff === 0) return "Today";
        if (diff === 1) return "Yesterday";
        return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
      }
      function maybeDaySeparator(d) {
        const key = d ? d.toDateString() : "earlier";
        if (key === lastDay) return;
        lastDay = key;
        const sep = document.createElement("div");
        sep.className = "day";
        sep.textContent = dayLabel(d);
        transcriptEl.appendChild(sep);
      }

      // Escape first (these messages come from the agent), then apply a tiny,
      // safe subset of Markdown. No raw HTML from the agent is ever injected.
      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }
      function inlineMd(s) {
        return s
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");
      }
      function renderMarkdown(text) {
        const lines = escapeHtml(text).split("\n");
        let html = "";
        let inList = false;
        const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };
        for (const line of lines) {
          const bullet = line.match(/^\s*[-*]\s+(.*)$/);
          const heading = line.match(/^\s*#{1,6}\s+(.*)$/);
          if (bullet) {
            if (!inList) { html += "<ul>"; inList = true; }
            html += "<li>" + inlineMd(bullet[1]) + "</li>";
          } else if (heading) {
            closeList();
            html += '<div class="h">' + inlineMd(heading[1]) + "</div>";
          } else if (line.trim() === "") {
            closeList();
            html += "<div></div>"; // blank line -> small gap
          } else {
            closeList();
            html += "<div>" + inlineMd(line) + "</div>";
          }
        }
        closeList();
        return html;
      }

      function addMessage(role, text, at) {
        if (!replayingHistory && role === "agent") speak(text);
        const d = parseAt(at);
        maybeDaySeparator(d);
        const el = document.createElement("div");
        el.className = "msg " + role;
        if (d && role !== "system") {
          const time = document.createElement("span");
          time.className = "time";
          time.textContent = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
          el.appendChild(time);
        }
        const body = document.createElement("div");
        body.className = "body";
        body.innerHTML = renderMarkdown(text);
        el.appendChild(body);
        transcriptEl.appendChild(el);
        el.scrollIntoView({ block: "end" });
      }

      function refreshComposer() {
        // Show the composer only when we're allowed to prompt, nothing is being
        // asked, and the agent isn't mid-task.
        const on = acceptsPrompts && !current && !busy;
        const wasOn = composerEl.classList.contains("on");
        composerEl.classList.toggle("on", on);
        sendEl.disabled = !on;
        // When it first appears (e.g. right after a long history loads), make
        // sure it's in view rather than below the fold.
        if (on && !wasOn) composerEl.scrollIntoView({ block: "end" });
      }

      function clearDecision() {
        current = null;
        armed = null;
        decisionEl.innerHTML = "";
        refreshComposer();
      }

      function answer(value) {
        const opt = current.options.find((o) => o.value === value);
        // High-risk permission: require a second tap to confirm an "allow".
        if (current.riskLevel === "high" && value === "allow" && armed !== value) {
          armed = value;
          render(current, `Tap again to confirm: ${opt.label}`);
          return;
        }
        ws.send(JSON.stringify({ type: "answer", toolUseId: current.toolUseId, value }));
        statusEl.textContent = `Sent: ${opt.label}`;
        decisionEl.innerHTML = "";
        current = null;
        armed = null;
        refreshComposer();
      }

      // Grow the box with the text (one line by default), capped by max-height.
      function autoGrow() {
        promptEl.style.height = "auto";
        promptEl.style.height = Math.min(promptEl.scrollHeight, 128) + "px";
        // WhatsApp pattern: show mic when empty, send arrow when typing
        const hasText = promptEl.value.trim().length > 0;
        micBtn.style.display = hasText ? "none" : "flex";
        sendEl.style.display = hasText ? "flex" : "none";
      }
      promptEl.addEventListener("input", autoGrow);
      // Enter sends; Shift+Enter makes a newline.
      promptEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          composerEl.requestSubmit();
        }
      });

      composerEl.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = promptEl.value.trim();
        if ((!text && pendingFiles.length === 0) || !ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: "prompt", text, files: pendingFiles }));
        promptEl.value = "";
        autoGrow();
        pendingFiles = [];
        renderAttachments();
      });

      function render(decision, note) {
        current = decision;
        refreshComposer();
        statusEl.textContent = decision.kind === "question" ? "The agent is asking:" : "Permission needed:";
        if (!note) {
          const parts = decision.options.map((o, i) => `${i + 1}, ${o.label}`);
          const risk = decision.riskLevel && decision.riskLevel !== "low" ? ` ${decision.riskLevel} risk.` : "";
          speak(`${decision.kind === "question" ? "Claude is asking" : "Permission needed"}. ${decision.title}.${risk} Options: ${parts.join(". ")}.`);
        }

        const frag = document.createDocumentFragment();
        const title = document.createElement("p");
        title.id = "title";
        title.textContent = decision.title;
        frag.appendChild(title);

        if (decision.riskLevel) {
          const r = document.createElement("span");
          r.className = "risk " + decision.riskLevel;
          r.textContent = decision.riskLevel.toUpperCase() + " RISK";
          frag.appendChild(r);
        }
        if (decision.command) {
          const c = document.createElement("div");
          c.id = "command";
          c.textContent = decision.command;
          frag.appendChild(c);
        }
        if (note) {
          const n = document.createElement("p");
          n.textContent = note;
          frag.appendChild(n);
        }

        decision.options.forEach((o, i) => {
          const b = document.createElement("button");
          if (o.value === "deny") b.className = "secondary";
          if (note && armed === o.value) b.className = "confirm";
          b.setAttribute("aria-label", o.description ? `${o.label}. ${o.description}` : o.label);
          b.innerHTML = o.label + (o.description ? `<span class="desc">${o.description}</span>` : "");
          b.onclick = () => answer(o.value);
          frag.appendChild(b);
          if (i === 0) setTimeout(() => b.focus(), 0);
        });

        decisionEl.innerHTML = "";
        decisionEl.appendChild(frag);
      }

      if (!token) statusEl.textContent = "Missing token in the URL.";
      else connect();
    </script>
  </body>
</html>
